# Film Lab review web app: python tools/review/review.py up [--no-ngrok]  (README.md in this folder).
# Both ports are published on 127.0.0.1 only: ngrok on the host tunnels 8790 (read-only); 8791 (ingest) is never public.
# The SQLite database lives in the named volume review-db; only this container opens it.
# Media: <lab>/out/_review/media, mounted read-only (out/ is git-ignored).
name: film-lab-review

services:
  film-lab-review:
    build:
      context: .
    image: film-lab-review:local
    container_name: film-lab-review
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
      - "127.0.0.1:8791:8791"
    volumes:
      - review-db:/data
      - ../../out/_review/media:/media:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  review-db:
